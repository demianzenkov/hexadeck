# Configuration file for the STM32 for VSCode extension
# Arrays can be inputted in two ways. One is: [entry_1, entry_2, ..., entry_final]
# or by adding an indented list below the variable name e.g.:
# VARIABLE:
# - entry_1
# - entry_2

# The project name
target: hexadeck-bootloader
# Can be C or C++
language: C++

optimization: Og

# MCU settings
targetMCU: stm32f4x
cpu: cortex-m4 # type of cpu e.g. cortex-m4
fpu: fpv4-sp-d16 # Defines how floating points are defined. Can be left empty.
floatAbi: -mfloat-abi=hard
ldscript: STM32F446VETX_BOOTLOADER.ld # linker script

# Compiler definitions. The -D prefix for the compiler will be automatically added.
cDefinitions: []
cxxDefinitions: []
asDefinitions: []

# Compiler definition files. you can add a single files or an array of files for different definitions.
# The file is expected to have a definition each new line.
# This allows to include for example a .definition file which can be ignored in git and can contain
# This can be convenient for passing along secrets at compile time, or generating a file for per device setup.
cDefinitionsFile:
cxxDefinitionsFile:
asDefinitionsFile:

# Compiler flags
cFlags: 
  - -Wall
  - -fdata-sections
  - -ffunction-sections

cxxFlags: 
  - -fno-rtti
  - -fno-exceptions

assemblyFlags: 
  - -Wall
  - -fdata-sections
  - -ffunction-sections

linkerFlags: 
  - -Wl,--print-memory-usage


# libraries to be included. The -l prefix to the library will be automatically added.
libraries: 
  - c
  - m

# Library directories. Folders can be added here that contain custom libraries.
libraryDirectories: []


# Include directories (directories containing .h or .hpp files)
# If a CubeMX makefile is present it will automatically include the include directories from that makefile.
# Bootloader's own includes come first to override firmware headers (e.g. stm32f4xx_hal_conf.h, main.h)
includeDirectories:
  - Core/Inc
  - Composite
  - Src
  - ../firmware/Drivers/STM32F4xx_HAL_Driver/Inc
  - ../firmware/Drivers/STM32F4xx_HAL_Driver/Inc/Legacy
  - ../firmware/Drivers/CMSIS/Device/ST/STM32F4xx/Include
  - ../firmware/Drivers/CMSIS/Include
  - ../firmware/Middlewares/Third_Party/AL94_USB_Composite/COMPOSITE/App
  - ../firmware/Middlewares/Third_Party/AL94_USB_Composite/COMPOSITE/Class/COMPOSITE/Inc
  - ../firmware/Middlewares/Third_Party/AL94_USB_Composite/COMPOSITE/Class/MIDI/Inc
  - ../firmware/Middlewares/Third_Party/AL94_USB_Composite/COMPOSITE/Core/Inc
  - ../firmware/Middlewares/Third_Party/AL94_USB_Composite/COMPOSITE/Target

# Files that should be included in the compilation.
# If a CubeMX makefile is present it will automatically include the  c and cpp/cxx files from that makefile.
# Glob patterns (https://www.wikiwand.com/en/Glob_(programming)) can be used.
# Do mind that double stars are reserved in yaml
# these should be escaped with a: \ or the name should be in double quotes e.g. "HARDWARE_DRIVER*.c"
sourceFiles:
  # Bootloader own sources
  - Core/Src/**
  - Src/**
  # HAL drivers (only the ones needed)
  - ../firmware/Drivers/STM32F4xx_HAL_Driver/Src/stm32f4xx_hal.c
  - ../firmware/Drivers/STM32F4xx_HAL_Driver/Src/stm32f4xx_hal_cortex.c
  - ../firmware/Drivers/STM32F4xx_HAL_Driver/Src/stm32f4xx_hal_dma.c
  - ../firmware/Drivers/STM32F4xx_HAL_Driver/Src/stm32f4xx_hal_dma_ex.c
  - ../firmware/Drivers/STM32F4xx_HAL_Driver/Src/stm32f4xx_hal_flash.c
  - ../firmware/Drivers/STM32F4xx_HAL_Driver/Src/stm32f4xx_hal_flash_ex.c
  - ../firmware/Drivers/STM32F4xx_HAL_Driver/Src/stm32f4xx_hal_flash_ramfunc.c
  - ../firmware/Drivers/STM32F4xx_HAL_Driver/Src/stm32f4xx_hal_gpio.c
  - ../firmware/Drivers/STM32F4xx_HAL_Driver/Src/stm32f4xx_hal_pcd.c
  - ../firmware/Drivers/STM32F4xx_HAL_Driver/Src/stm32f4xx_hal_pcd_ex.c
  - ../firmware/Drivers/STM32F4xx_HAL_Driver/Src/stm32f4xx_hal_pwr.c
  - ../firmware/Drivers/STM32F4xx_HAL_Driver/Src/stm32f4xx_hal_pwr_ex.c
  - ../firmware/Drivers/STM32F4xx_HAL_Driver/Src/stm32f4xx_hal_rcc.c
  - ../firmware/Drivers/STM32F4xx_HAL_Driver/Src/stm32f4xx_hal_rcc_ex.c
  - ../firmware/Drivers/STM32F4xx_HAL_Driver/Src/stm32f4xx_hal_tim.c
  - ../firmware/Drivers/STM32F4xx_HAL_Driver/Src/stm32f4xx_hal_tim_ex.c
  - ../firmware/Drivers/STM32F4xx_HAL_Driver/Src/stm32f4xx_ll_usb.c
  # USB Composite / MIDI
  - ../firmware/Middlewares/Third_Party/AL94_USB_Composite/COMPOSITE/App/usb_device.c
  - ../firmware/Middlewares/Third_Party/AL94_USB_Composite/COMPOSITE/App/usbd_desc.c
  - ../firmware/Middlewares/Third_Party/AL94_USB_Composite/COMPOSITE/App/usbd_midi_if.c
  - ../firmware/Middlewares/Third_Party/AL94_USB_Composite/COMPOSITE/Class/COMPOSITE/Src/usbd_composite.c
  - ../firmware/Middlewares/Third_Party/AL94_USB_Composite/COMPOSITE/Class/MIDI/Src/usbd_midi.c
  - ../firmware/Middlewares/Third_Party/AL94_USB_Composite/COMPOSITE/Core/Src/usbd_core.c
  - ../firmware/Middlewares/Third_Party/AL94_USB_Composite/COMPOSITE/Core/Src/usbd_ctlreq.c
  - ../firmware/Middlewares/Third_Party/AL94_USB_Composite/COMPOSITE/Core/Src/usbd_ioreq.c
  - ../firmware/Middlewares/Third_Party/AL94_USB_Composite/COMPOSITE/Target/usbd_conf.c
  # Startup (shared with firmware)
  - ../firmware/Core/Startup/startup_stm32f446vetx.s


# When no makefile is present it will show a warning pop-up.
# However when compilation without the CubeMX Makefile is desired, this can be turned of.
suppressMakefileWarning: true

# Custom makefile rules
# Here custom makefile rules can be added to the STM32Make.make file
# an example of how this can be used is commented out below.
customMakefileRules:
# - command: sayhello
#   rule: echo "hello"
#   dependsOn: $(BUILD_DIR)/$(TARGET).elf # can be left out    

# Additional flags which will be used when invoking the make command
makeFlags:
# - -O  # use this option when the output of make is mixed up only works for make version 4.0 and upwards
# - --silent # use this option to silence the output of the build
    